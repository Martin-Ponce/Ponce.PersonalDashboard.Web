worker_processes  1;

# Non-root image, so pid and temp files go to /tmp.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_any;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile        on;
    keepalive_timeout  65;
    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;

    server {
        listen 4000;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Rewritten at container start, never cache it.
        location = /assets/env.js {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        # Not fingerprinted, so always revalidate.
        location /i18n/ {
            add_header Cache-Control "no-cache";
        }

        # Fingerprinted bundles, safe to cache forever.
        location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # SPA fallback; index.html always revalidates.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
